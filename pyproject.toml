[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "proxax"
version = "0.0.1"
description = "Certified first-order proximal point methods for composite optimization in JAX and Optax."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "William Kong", email = "wwkong92@gmail.com" },
]
keywords = [
  "augmented-lagrangian",
  "composite-optimization",
  "jax",
  "nonconvex-optimization",
  "optax",
  "optimization",
  "proximal",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "jax>=0.4.30",
  "optax>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/wwkong/proxax"
Documentation = "https://proxax.readthedocs.io/"
Repository = "https://github.com/wwkong/proxax"
Issues = "https://github.com/wwkong/proxax/issues"

[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]>=0.4.30",
]
cuda13 = [
  "jax[cuda13]>=0.5.0",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]
docs = [
  "furo>=2024.8",
  "myst-parser>=4.0",
  "sphinx>=8.0",
  "sphinx-autodoc-typehints>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proxax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = [
  "N803",
  "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["optax"]
ignore_missing_imports = true
